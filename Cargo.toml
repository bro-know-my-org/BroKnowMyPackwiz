[package]
name = "bro-know-my-packwiz"
version = "0.1.1"
edition = "2024"
description = "Rust CLI for packwiz-style modpack maintenance and distribution"
license = "MIT"
readme = "README.md"
repository = "https://github.com/bro-know-my-org/BroKnowMyPackwiz"

[dependencies]
crc32fast = "1.5.0"
crossterm = "0.28"
directories = "6"
fs2 = "0.4"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.11.0"
sha2 = "0.11.0"
toml_edit = "0.22"
unicode-width = "0.2"
ureq = { version = "3.0.12", default-features = false, features = ["rustls"] }

[[bin]]
name = "bkmpw"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
zip = { version = "4", default-features = false }
